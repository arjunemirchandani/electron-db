name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the draft release once, so the parallel build jobs never race
  # to create it (electron-builder reuses an existing draft, but three
  # simultaneous creates collide with 422 already_exists).
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release for tag
        run: |
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --draft --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build-and-publish:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Build installers and upload to draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the draft only when every platform uploaded successfully.
  publish:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "$TAG" -R "$REPO" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
