version: 2
updates:
  # npm dependencies: weekly, with minor/patch changes grouped into a
  # single PR so the queue stays readable. Majors arrive individually —
  # they deserve individual attention (Electron especially).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Types track the runtime major (Node 22 in CI and in Electron);
      # lift this when the runtime itself moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 removed baseUrl and non-relative paths; hold on mature
      # 5.x until the ecosystem (typescript-eslint, toolchains) settles on 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # electron-vite's peer range is vite ^5||^6||^7 — it doesn't support
      # Vite 8 yet. Remove both entries when it does.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
    groups:
      # vite and its plugins are peer-locked; their updates travel together.
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # The CI/release workflows' actions age too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
